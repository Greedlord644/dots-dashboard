<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0b0d">

    <meta
        name="description"
        content="Dream of the Sun – termíny a aktuální úkoly kapely."
    >

    <title>DOTS Dashboard</title>

    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <div class="page">

        <!-- ==========================================
             HEADER
        =========================================== -->

        <header class="site-header">

            <div class="brand">

                <img
                    src="assets/logo.png"
                    alt="Dream of the Sun"
                    class="brand-logo"
                >

                <div class="brand-text">
                    <h1>DOTS Dashboard</h1>
                    <p>Dream of the Sun</p>
                </div>

            </div>

            <div class="last-update">
                <span class="last-update-label">
                    Poslední aktualizace
                </span>

                <span id="last-update-value">
                    Načítám...
                </span>
            </div>

        </header>


        <main>

            <!-- ==========================================
                 TERMÍNY
            =========================================== -->

            <section
                class="dashboard-section schedules-section collapsible-section"
                id="schedules-section"
            >

                <div class="section-heading">

                    <div>
                        <span class="section-kicker">
                            Kalendář
                        </span>

                        <h2>Termíny</h2>
                    </div>


                    <button
                        type="button"
                        class="section-toggle"
                        id="schedules-toggle"
                        aria-expanded="true"
                        aria-controls="schedules-content"
                    >
                        <span
                            class="section-toggle-icon"
                            aria-hidden="true"
                        >
                            −
                        </span>

                        <span class="section-toggle-label">
                            Sbalit
                        </span>
                    </button>

                </div>


                <!--
                    Obsah celé sekce Termíny.

                    Po kliknutí na Sbalit se schová:
                    - filtr
                    - termíny
                    - případná hláška o prázdném výsledku

                    Nadpis Termíny a tlačítko zůstanou.
                -->

                <div
                    class="section-content"
                    id="schedules-content"
                >

                    <!-- FILTRY -->

                    <div
                        class="filters"
                        id="schedule-filters"
                    >

                        <div class="filter-group">

                            <span class="filter-label">
                                Událost
                            </span>

                            <div
                                class="filter-options"
                                id="event-type-filters"
                            >
                                <!--
                                    JavaScript automaticky vloží:
                                    Zkoušky
                                    Studio
                                    Koncerty
                                -->
                            </div>

                        </div>


                        <div class="filter-group">

                            <span class="filter-label">
                                Rok
                            </span>

                            <div
                                class="filter-options"
                                id="year-filters"
                            >
                                <!--
                                    Roky se vytvoří automaticky
                                    podle dat.
                                -->
                            </div>

                        </div>

                    </div>


                    <!-- TERMÍNY -->

                    <div
                        id="schedule-container"
                        class="schedule-container"
                    >

                        <div class="loading-state">
                            Načítám termíny...
                        </div>

                    </div>


                    <!-- PRÁZDNÝ VÝSLEDEK FILTRU -->

                    <div
                        id="schedule-empty"
                        class="empty-state"
                        hidden
                    >
                        Pro vybrané filtry nejsou žádné termíny.
                    </div>

                </div>

            </section>


            <!-- ==========================================
                 AKTUÁLNÍ ÚKOLY
            =========================================== -->

            <section
                class="dashboard-section tasks-section collapsible-section"
                id="tasks-section"
            >

                <div class="section-heading">

                    <div>
                        <span class="section-kicker">
                            Kapela
                        </span>

                        <h2>Aktuální úkoly</h2>
                    </div>


                    <button
                        type="button"
                        class="section-toggle"
                        id="tasks-toggle"
                        aria-expanded="true"
                        aria-controls="tasks-content"
                    >
                        <span
                            class="section-toggle-icon"
                            aria-hidden="true"
                        >
                            −
                        </span>

                        <span class="section-toggle-label">
                            Sbalit
                        </span>
                    </button>

                </div>


                <!--
                    Obsah sekce Aktuální úkoly.

                    Po sbalení zůstane pouze nadpis
                    a tlačítko Rozbalit.
                -->

                <div
                    class="section-content"
                    id="tasks-content"
                >

                    <div
                        id="tasks-container"
                        class="tasks-container"
                    >

                        <div class="loading-state">
                            Načítám úkoly...
                        </div>

                    </div>


                    <div
                        id="tasks-empty"
                        class="empty-state"
                        hidden
                    >
                        Momentálně nejsou evidovány žádné úkoly.
                    </div>

                </div>

            </section>

        </main>


        <!-- ==========================================
             FOOTER
        =========================================== -->

        <footer class="site-footer">

            <span>
                Dream of the Sun
            </span>

            <span class="footer-separator">
                •
            </span>

            <span>
                DOTS Dashboard
            </span>

        </footer>

    </div>


    <!-- ==========================================
         TEMPLATE TERMÍNU
    =========================================== -->

    <template id="schedule-card-template">

        <article class="schedule-card">

            <div class="schedule-main">

                <div class="schedule-date">

                    <span class="schedule-date-value"></span>

                    <span class="schedule-day"></span>

                </div>


                <div class="schedule-event-row">

                    <h3 class="schedule-event"></h3>


                    <span
                        class="status-badge tentative-badge"
                        hidden
                    >
                        Předběžné
                    </span>

                </div>


                <div
                    class="schedule-note"
                    hidden
                ></div>

            </div>


            <div class="schedule-meta">

                <div
                    class="pickup-info"
                    hidden
                >

                    <span class="meta-label">
                        Vyzvednutí na Skalce?
                    </span>


                    <span class="pickup-value"></span>

                </div>

            </div>

        </article>

    </template>


    <!-- ==========================================
         TEMPLATE ŘEŠITELE
    =========================================== -->

    <template id="task-person-template">

        <section class="task-person">

            <div class="task-person-heading">

                <h3 class="task-person-name"></h3>

                <span class="task-count"></span>

            </div>


            <div class="task-list"></div>

        </section>

    </template>


    <!-- ==========================================
         TEMPLATE ÚKOLU
    =========================================== -->

    <template id="task-card-template">

        <article class="task-card">

            <div class="task-header">

                <h4 class="task-title"></h4>


                <span
                    class="status-badge overdue-badge"
                    hidden
                >
                    Po termínu
                </span>

            </div>


            <div
                class="task-dates"
                hidden
            >

                <div
                    class="task-date task-created"
                    hidden
                >

                    <span class="meta-label">
                        Zadáno
                    </span>


                    <span class="task-created-value"></span>

                </div>


                <div
                    class="task-date task-deadline"
                    hidden
                >

                    <span class="meta-label">
                        Termín
                    </span>


                    <span class="task-deadline-value"></span>

                </div>

            </div>


            <div
                class="task-note"
                hidden
            ></div>

        </article>

    </template>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="assets/app.js"></script>

</body>
</html>
