name: Update DOTS Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard data
        run: python scripts/update_data.py

      - name: Show generated data
        run: |
          echo "===== data/dashboard.json ====="
          cat data/dashboard.json

      - name: Commit updated dashboard data
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json
          git commit -m "Update dashboard data"
          git push
